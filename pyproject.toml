[project]
name = "uavvisuallocalization"
version = "0.1.0"
description = "No GPS Localization"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "faiss-cpu",
    "omegaconf",
]

[dependency-groups]
dev = [
    "opencv-python",
    "torch",
    "matplotlib",
    "rasterio",
    "ipykernel",
    "jupyter",
    "onnx",
    "onnxscript",
]

pi = [
    "onnxruntime",
]

[tool.uv]
package = false
